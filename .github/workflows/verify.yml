name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  npm_config_engine_strict: "true"
  npm_config_strict_allow_scripts: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Run verify
        run: npm run verify

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes --allow-scripts=fsevents playwright@1.61.1 install --with-deps chromium

      - name: Verify linked application package caching
        env:
          JSKIT_VITE_LINKED_PACKAGE_CACHE_INTEGRATION: "1"
        run: node --test packages/agent-docs/test/viteLinkedPackageCache.browser.test.js

      - name: Verify responsive CRUD date filters
        env:
          JSKIT_HTTP_WEB_DATE_FILTER_VISUAL_INTEGRATION: "1"
        run: node --test packages/http-web/test/crudListDateFilterSurface.browser.test.js

      - name: Verify adaptive shell behavior
        env:
          JSKIT_SHELL_WEB_BROWSER_INTEGRATION: "1"
        run: node --test packages/shell-web/test/adaptiveShell.browser.test.js

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - browser-contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/agent-docs/site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
