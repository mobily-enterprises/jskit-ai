name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  npm_config_engine_strict: "true"
  npm_config_strict_allow_scripts: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
    # The data tests never skip: each MariaDB one makes and drops a database of its own beside TEST_DB_NAME on this
    # server. The PostgreSQL ones leave this MariaDB run (DB_CLIENT) to test-databases-postgres.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: application
          MARIADB_ROOT_PASSWORD: native_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Run verify
        env:
          DB_CLIENT: mysql2
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: native_test_password
          DB_NAME: application
          TEST_DB_NAME: jskit_data_test
        run: npm run verify

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes --allow-scripts=fsevents playwright@1.61.1 install --with-deps chromium

      - name: Verify foundation loading before JavaScript
        env:
          JSKIT_FOUNDATION_STARTUP_INTEGRATION: "1"
        run: npx jskit test packages/agent-docs/test/foundationStartup.browser.test.js

      - name: Verify a preview can frame the application
        env:
          JSKIT_KERNEL_FRAMING_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/kernel/test/securityHeadersFraming.browser.test.js

      - name: Verify linked application package caching
        env:
          JSKIT_VITE_LINKED_PACKAGE_CACHE_INTEGRATION: "1"
        run: npx jskit test packages/agent-docs/test/viteLinkedPackageCache.browser.test.js

      - name: Verify responsive CRUD date filters
        env:
          JSKIT_HTTP_WEB_DATE_FILTER_VISUAL_INTEGRATION: "1"
        run: npx jskit test packages/http-web/test/crudListDateFilterSurface.browser.test.js

      - name: Verify select fields never show stored ids
        env:
          JSKIT_HTTP_WEB_SELECT_FIELD_BROWSER: "1"
        run: npx jskit test packages/http-web/test/selectField.browser.test.js

      - name: Verify list record action menus are menus
        env:
          JSKIT_HTTP_WEB_RECORD_ACTION_MENU_BROWSER: "1"
        run: npx jskit test packages/http-web/test/crudListRecordActionMenu.browser.test.js

      - name: Verify select typeahead while a menu opens
        env:
          JSKIT_CONNECTORS_WEB_BROWSER: "1"
        run: npx jskit test packages/connectors-web/test/selectTypeahead.browser.test.js

      - name: Verify shared assistant conversation UI
        env:
          JSKIT_ASSISTANT_CORE_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/assistant-core/test/assistantScroll.browser.test.js

      - name: Verify ready-made assistant lifecycle
        env:
          JSKIT_ASSISTANT_RUNTIME_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/assistant-runtime/test/conversation.browser.test.js

      - name: Verify the assistant settings pane's app bar Save
        env:
          JSKIT_ASSISTANT_RUNTIME_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/assistant-runtime/test/assistantSettings.browser.test.js

      - name: Verify adaptive shell behavior
        env:
          JSKIT_SHELL_WEB_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/shell-web/test/adaptiveShell.browser.test.js

      - name: Verify the Material 3 baselines
        env:
          JSKIT_MATERIAL_BASELINES: "1"
        run: npx jskit test packages/shell-web/test/materialBaselines.browser.test.js packages/http-web/test/crudScreensMaterialBaselines.browser.test.js

      - name: Verify sign-in behavior
        env:
          JSKIT_AUTH_WEB_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/auth-web/test/signIn.browser.test.js

      - name: Verify account settings behavior
        env:
          JSKIT_USERS_WEB_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/users-web/test/accountSettings.browser.test.js

      - name: Verify a translated app shows no English
        env:
          JSKIT_USERS_WEB_BROWSER_INTEGRATION: "1"
        run: npx jskit test packages/users-web/test/translatedApp.browser.test.js

  browser-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: application
          MARIADB_ROOT_PASSWORD: native_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify test databases restored from a schema snapshot (MariaDB)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: native_test_password
          DB_NAME: application
          TEST_DB_NAME: browser_pattern_test
        run: npx jskit test packages/database-runtime-mysql/test/testDatabases.mysql.test.js

  test-databases-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: application_test
          POSTGRES_USER: application
          POSTGRES_PASSWORD: native_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U application -d application_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The resource-runtime and crud-core data tests run here on PostgreSQL too (DB_CLIENT=pg), each in a schema of
      # its own, with the row-lock, many-row write and upsert races in locks.postgres.test.js.
      - name: Verify test databases and the PostgreSQL data tests
        env:
          DB_CLIENT: pg
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: application
          DB_PASSWORD: native_test_password
          DB_NAME: application_test
          TEST_DB_NAME: application_test
        run: npx jskit test packages/database-runtime/test/*.postgres.test.js packages/agent-runtime/test/*.postgres.test.js packages/resource-runtime/test/*.postgres.test.js packages/resource-runtime/test/resourceRuntime.test.js packages/resource-runtime/test/callSettings.test.js packages/resource-runtime/test/hiddenFields.test.js packages/resource-runtime/test/lostInsertRace.test.js packages/resource-runtime/test/queryFields.test.js packages/resource-runtime/test/testHelpers.test.js packages/crud-core/test/crudOnHandles.test.js packages/crud-core/test/hiddenFields.test.js packages/crud-core/test/crudFeaturePackagePattern.test.js

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - browser-contracts
      - browser-database
      - test-databases-postgres
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/agent-docs/site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
