name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate package publication without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  npm_config_engine_strict: "true"
  npm_config_strict_allow_scripts: "true"

jobs:
  database-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - mariadb
          - postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify a clean database-backed app
        env:
          JSKIT_DATABASE_INTEGRATION_DRIVER: ${{ matrix.database }}
        run: node --test tooling/create-app/test/databaseCi.integration.test.js

  vite-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes --allow-scripts=fsevents playwright@1.61.1 install --with-deps chromium

      - name: Verify Vite startup and local-package caching
        env:
          JSKIT_VITE_COLD_START_INTEGRATION: "1"
          JSKIT_VITE_LOCAL_PACKAGE_CACHE_INTEGRATION: "1"
        run: node --test tooling/create-app/test/viteColdStart.integration.test.js

      - name: Verify responsive CRUD date filters
        env:
          JSKIT_HTTP_WEB_DATE_FILTER_VISUAL_INTEGRATION: "1"
        run: node --test packages/http-web/test/crudListDateFilterSurface.browser.test.js

  publish:
    needs:
      - database-ci
      - vite-cold-start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: npm run verify

      - name: Publish coordinated packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run release:npm:publish:dry-run
          else
            npm run release:npm:publish
          fi

      - name: Verify published registry state
        if: ${{ inputs.dry_run != true }}
        run: npm run verify:registry
