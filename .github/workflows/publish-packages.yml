name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate package publication without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  npm_config_engine_strict: "true"
  npm_config_strict_allow_scripts: "true"

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    # Its steps' switches now run every browser test file they turn on, as verify's do; 20 minutes, as there.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes --allow-scripts=fsevents playwright@1.61.1 install --with-deps chromium

      # Each step sets JSKIT_* switches; npm run test:browser runs every browser test file whose switches are set.
      - name: Verify foundation loading before JavaScript
        env:
          JSKIT_FOUNDATION_STARTUP_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify linked application package caching
        env:
          JSKIT_VITE_LINKED_PACKAGE_CACHE_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify responsive CRUD date filters
        env:
          JSKIT_HTTP_WEB_DATE_FILTER_VISUAL_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify select fields never show stored ids
        env:
          JSKIT_HTTP_WEB_SELECT_FIELD_BROWSER: "1"
        run: npm run test:browser

      - name: Verify list record action menus are menus
        env:
          JSKIT_HTTP_WEB_RECORD_ACTION_MENU_BROWSER: "1"
        run: npm run test:browser

      - name: Verify shared assistant conversation UI: scrolling, message delivery and the transcript theme
        env:
          JSKIT_ASSISTANT_CORE_BROWSER_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify the ready-made assistant: its lifecycle, conversation binding and the settings pane's app bar Save
        env:
          JSKIT_ASSISTANT_RUNTIME_BROWSER_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify the adaptive shell, the inert page behind a dialog, pending actions' focus, the environment banner and the production build
        env:
          JSKIT_SHELL_WEB_BROWSER_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify the Material 3 baselines
        env:
          JSKIT_MATERIAL_BASELINES: "1"
        run: npm run test:browser

      - name: Verify sign-in, second-factor, strict-cookie and pass sign-in behavior
        env:
          JSKIT_AUTH_WEB_BROWSER_INTEGRATION: "1"
        run: npm run test:browser

      - name: Verify account settings behavior and a translated app with no English
        env:
          JSKIT_USERS_WEB_BROWSER_INTEGRATION: "1"
        run: npm run test:browser

  publish:
    needs: browser-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: npm run verify

      - name: Publish coordinated packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run npm-publish:dry-run
          else
            npm run npm-publish
          fi

      - name: Verify published registry state
        if: ${{ inputs.dry_run != true }}
        run: npm run verify:registry
