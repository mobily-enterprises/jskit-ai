name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate package publication without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  npm_config_engine_strict: "true"
  npm_config_strict_allow_scripts: "true"

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes --allow-scripts=fsevents playwright@1.61.1 install --with-deps chromium

      - name: Verify responsive CRUD date filters
        env:
          JSKIT_HTTP_WEB_DATE_FILTER_VISUAL_INTEGRATION: "1"
        run: node --test packages/http-web/test/crudListDateFilterSurface.browser.test.js

      - name: Verify adaptive shell behavior
        env:
          JSKIT_SHELL_WEB_BROWSER_INTEGRATION: "1"
        run: node --test packages/shell-web/test/adaptiveShell.browser.test.js

  publish:
    needs: browser-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        run: npm run verify

      - name: Publish coordinated packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run release:npm:publish:dry-run
          else
            npm run release:npm:publish
          fi

      - name: Verify published registry state
        if: ${{ inputs.dry_run != true }}
        run: npm run verify:registry
